<!doctype html><html><head><meta charset="utf-8"><title>Set gallery</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:1920px;height:1080px}</style>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
</head><body><canvas id="gl"></canvas>
<script type="module">
import { createRenderer, createPost } from './lib/ptb2/kit.js';
import * as S from './lib/ptb2/sets.js';
const { renderer, envMap } = createRenderer(document.getElementById('gl'), 1920, 1080);
const post = createPost(renderer, 1920, 1080);
const list = [
  [S.peopleSet(envMap), (s) => { s.state.aged = 25; }],
  [S.barsSet(envMap, { bars: [{ v: 79, color: 0x7fe0cf }, { v: 80, color: 0x7fe0cf }, { v: 14, color: 0xf6b55b }], max: 100 }), (s) => { s.state.b0 = s.state.b1 = s.state.b2 = 1; }],
  [S.barsSet(envMap, { bars: [-0.8, 0, 0.2, 1.3, 1.1, 0.4].map((v, i) => ({ v, color: v < 0 ? 0xff8a73 : 0x7fe0cf, ghost: i > 2 })), max: 1.5, height: 3, negative: true }), (s) => { for (let i = 0; i < 6; i++) s.state['b' + i] = 1; }],
  [S.salarySet(envMap), (s) => { s.state.split = 1; }],
  [S.coinsSet(envMap, { stacks: [36] }), (s) => { s.state.fill = 1; }],
  [S.roomSet(envMap), (s) => { s.state.argue = 1; s.state.arbiter = 1; }],
  [S.pingpongSet(envMap, ['berlin', 'state', 'table', 'law']), (s) => { s.state.hop = 0.5; s.state.ball = 1; }],
  [S.factorySet(envMap), (s) => { s.state.travel = 3; s.state.ship = 0.5; }],
  [S.wardSet(envMap), (s) => { s.state.night = 0.8; s.state.surgery = 1; s.state.overnight = 1; s.state.resident = 1; s.state.ambulance = 1; s.state.clock = 3.2; }],
  [S.layersSet(envMap), (s) => { s.state.l1 = s.state.l2 = s.state.l3 = 1; s.state.f3 = 1; s.state.lever = 2; }],
];
window.VIDEO = { width: 1920, height: 1080, fps: 30, duration: list.length };
window.seek = (t) => { const [s, f] = list[Math.min(list.length - 1, Math.floor(t))]; f(s); s.update(t); post.render(s.scene, s.camera, s.post); };
</script></body></html>
