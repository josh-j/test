<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Example scene</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Scene contract (see ../CLAUDE.md): window.VIDEO + a pure window.seek(t).
window.VIDEO = { width: 1920, height: 1080, fps: 30, duration: 6 };

const { width: W, height: H } = window.VIDEO;
const canvas = document.getElementById('c');
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
// Progress of t through [start, end], eased.
const ease = (t, start, end) => {
  const p = clamp((t - start) / (end - start));
  return 1 - Math.pow(1 - p, 3);
};

window.seek = (t) => {
  // Background gradient that slowly rotates.
  const a = t * 0.3;
  const g = ctx.createLinearGradient(
    W / 2 + Math.cos(a) * W, H / 2 + Math.sin(a) * H,
    W / 2 - Math.cos(a) * W, H / 2 - Math.sin(a) * H);
  g.addColorStop(0, '#1a1033');
  g.addColorStop(1, '#0b2a3a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Orbiting dots, staggered in.
  for (let i = 0; i < 12; i++) {
    const appear = ease(t, 0.1 * i, 0.1 * i + 0.6);
    const ang = t * 0.8 + (i / 12) * Math.PI * 2;
    const r = 320 * appear;
    ctx.fillStyle = `hsla(${(i * 30 + t * 40) % 360}, 80%, 65%, ${appear})`;
    ctx.beginPath();
    ctx.arc(W / 2 + Math.cos(ang) * r, H / 2 + Math.sin(ang) * r, 18, 0, Math.PI * 2);
    ctx.fill();
  }

  // Title slides up and fades in, then out at the end.
  const inP = ease(t, 1.2, 2.2);
  const outP = ease(t, 5.2, 5.9);
  ctx.globalAlpha = inP * (1 - outP);
  ctx.fillStyle = '#fff';
  ctx.font = '700 120px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Made with code', W / 2, H / 2 + (1 - inP) * 60);
  ctx.font = '400 40px system-ui, sans-serif';
  ctx.fillStyle = '#9fd3ff';
  ctx.fillText('every frame drawn by seek(t)', W / 2, H / 2 + 110 + (1 - inP) * 60);
  ctx.globalAlpha = 1;
};

// Realtime preview when opened in a normal browser; the renderer sets __RENDER__.
if (!window.__RENDER__) {
  const start = performance.now();
  const loop = () => {
    const t = ((performance.now() - start) / 1000) % window.VIDEO.duration;
    window.seek(t);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
} else {
  window.seek(0);
}
</script>
</body>
</html>
