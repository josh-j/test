<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Style D · Data noir</title>
<link rel="stylesheet" href="lib/motion.css">
<style>
  #stage { background: #04080b; color: #dff7f3; font-family: var(--sans); }
  #finish { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.7) 100%); }
  .mono { font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .glow { text-shadow: 0 0 18px rgba(64,230,210,0.55), 0 0 2px rgba(64,230,210,0.9); }
  .aglow { color: #ffb347; text-shadow: 0 0 22px rgba(255,170,60,0.6), 0 0 2px rgba(255,190,90,0.9); }
  .hud { position: absolute; font-family: var(--sans); font-weight: 500; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(120,230,215,0.65); }
  .big { position: absolute; font-weight: 600; font-size: 200px; letter-spacing: -0.04em; }
  .mid { position: absolute; font-weight: 500; font-size: 64px; letter-spacing: -0.01em; }
  #scan { position: absolute; left: 0; width: 1920px; height: 160px; background: linear-gradient(rgba(64,230,210,0), rgba(64,230,210,0.08), rgba(64,230,210,0)); }
  #lines { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 2px, rgba(0,0,0,0) 2px 4px); pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <svg class="abs" id="grid" width="1920" height="1080" style="left:0; top:0">
    <g stroke="rgba(64,230,210,0.12)" stroke-width="1">
      <path class="gl" d="M0 180 H1920"/><path class="gl" d="M0 360 H1920"/><path class="gl" d="M0 540 H1920"/><path class="gl" d="M0 720 H1920"/><path class="gl" d="M0 900 H1920"/>
      <path class="gl" d="M240 0 V1080"/><path class="gl" d="M480 0 V1080"/><path class="gl" d="M720 0 V1080"/><path class="gl" d="M960 0 V1080"/><path class="gl" d="M1200 0 V1080"/><path class="gl" d="M1440 0 V1080"/><path class="gl" d="M1680 0 V1080"/>
    </g>
    <path id="trunk" d="M240 540 H900" fill="none" stroke="#40e6d2" stroke-width="4" filter="url(#bloom)"/>
    <path id="up" d="M900 540 C1080 540 1080 330 1300 330 H1680" fill="none" stroke="#40e6d2" stroke-width="4" filter="url(#bloom)"/>
    <path id="down" d="M900 540 C1080 540 1080 750 1300 750 H1680" fill="none" stroke="#ffb347" stroke-width="4" filter="url(#bloom)"/>
    <circle id="node" cx="900" cy="540" r="10" fill="#dff7f3" filter="url(#bloom)"/>
    <defs><filter id="bloom" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  </svg>
  <div class="hud" id="hud1" style="left:240px; top:120px">DE · 2026 · HYBRID-DRG G24Q · GROIN HERNIA</div>
  <div class="big mono glow" id="price" style="left:240px; top:300px">€0000.00</div>
  <div class="hud" id="hud2" style="left:240px; top:540px">FIXED PRICE · SIMPLE REPAIR</div>
  <div class="mid glow" id="pa" style="left:1300px; top:240px">Home today</div>
  <div class="mid aglow" id="pb" style="left:1300px; top:660px">One night</div>
  <div class="hud" id="ha" style="left:1300px; top:350px">€2,082.60</div>
  <div class="hud" id="hb" style="left:1300px; top:770px; color:rgba(255,180,90,0.75)">€2,082.60 · night unpaid</div>
  <div class="mid glow" id="e1" style="left:240px; top:400px; font-size:110px; font-weight:600; letter-spacing:-0.03em">The rule changes fast.</div>
  <div class="mid aglow" id="e2" style="left:240px; top:540px; font-size:110px; font-weight:600; letter-spacing:-0.03em">Hospitals change slowly.</div>
  <div id="scan"></div>
  <div id="lines"></div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<script src="../node_modules/gsap/dist/MorphSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="lib/motion.js"></script>
<script>
// Digits scramble then lock in, left to right (deterministic in time).
function scramble(tl, sel, target, at, dur) {
  const el = M.$(sel), o = { p: 0 };
  tl.to(o, { p: 1, duration: dur, ease: 'none', onUpdate() {
    const lock = Math.floor(o.p * target.length);
    let s = '';
    for (let i = 0; i < target.length; i++) {
      const ch = target[i];
      if (i < lock || !/[0-9]/.test(ch)) s += ch;
      else s += String((Math.floor(o.p * 97 * (i + 3)) + i * 7) % 10);
    }
    el.textContent = s;
  } }, at);
}
// Chromatic split for glitch cuts.
const glitch = (tl, sel, at) => {
  tl.to(sel, { textShadow: '6px 0 rgba(255,60,80,0.8), -6px 0 rgba(60,220,255,0.8)', x: 8, duration: 0.05 }, at)
    .to(sel, { textShadow: '', x: 0, duration: 0.08 }, at + 0.12);
  M.cue(at, 'tick', 1.6);
};
M.scene({
  duration: 10.5, fadeIn: 0.3,
  build(tl) {
    gsap.set(['#pa', '#pb', '#ha', '#hb', '#e1', '#e2'], { autoAlpha: 0 });
    M.draw(tl, '.gl', 0, { dur: 1.2 });
    tl.fromTo('#scan', { top: -200 }, { top: 1100, duration: 2.2, ease: 'none', repeat: 4 }, 0);
    M.typeIn(tl, '#hud1', 0.4, { by: 'chars', stagger: 0.012, y: 0, blur: 0, cue: null });
    scramble(tl, '#price', '€2,082.60', 0.9, 1.5);
    M.cue(2.4, 'hit', 0.8);
    glitch(tl, '#price', 2.4);
    M.typeIn(tl, '#hud2', 2.6, { by: 'chars', stagger: 0.01, y: 0, blur: 0, cue: null });
    // the price becomes a signal line that forks into two paths
    tl.to('#price', { scale: 0.45, transformOrigin: '0% 50%', y: 120, autoAlpha: 0.5, duration: 0.8, ease: 'expo.inOut' }, 3.6);
    tl.to('#hud2', { autoAlpha: 0, duration: 0.3 }, 3.6);
    M.draw(tl, '#trunk', 4.0, { dur: 0.6 });
    tl.from('#node', { scale: 0, transformOrigin: '50% 50%', duration: 0.4, ease: 'back.out(3)' }, 4.5);
    M.cue(4.5, 'pop', 1);
    M.draw(tl, ['#up', '#down'], 4.7, { dur: 0.9 });
    M.cue(4.7, 'whoosh', 0.7);
    M.fadeIn(tl, ['#pa', '#pb'], 5.4, { y: 10, dur: 0.4 });
    glitch(tl, '#pa', 5.4); glitch(tl, '#pb', 5.6);
    M.typeIn(tl, '#ha', 5.9, { by: 'chars', stagger: 0.02, y: 0, blur: 0, cue: null });
    M.typeIn(tl, '#hb', 6.1, { by: 'chars', stagger: 0.02, y: 0, blur: 0, cue: null });
    tl.to('#down', { strokeDasharray: '12 10', duration: 0.01 }, 7.0).to('#down', { autoAlpha: 0.45, duration: 0.6 }, 7.0);
    // glitch cut to the thesis
    tl.to(['#grid', '#price', '#hud1', '#pa', '#pb', '#ha', '#hb'], { autoAlpha: 0, duration: 0.08 }, 8.0);
    M.cue(8.0, 'hit', 0.9);
    tl.set(['#e1', '#e2'], { autoAlpha: 1 }, 8.1);
    M.typeIn(tl, '#e1', 8.1, { by: 'chars', stagger: 0.018, y: 0, blur: 12, cue: null });
    M.typeIn(tl, '#e2', 8.8, { by: 'chars', stagger: 0.018, y: 0, blur: 12, cue: null });
    glitch(tl, '#e2', 9.6);
  },
});
</script>
</body>
</html>
