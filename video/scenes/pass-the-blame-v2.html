  /* age grid */

  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }

  /* pressure meter: big, plain, labelled */
  #meter { position: absolute; right: 80px; top: 72px; width: 500px; padding: 22px 26px 18px; border-radius: 20px; visibility: hidden;
           background: rgba(12, 24, 38, 0.74); border: 1px solid rgba(150, 215, 225, 0.25); backdrop-filter: blur(12px); font-family: var(--sans); color: #eaf4f6; }
  #meter .mk { display: flex; justify-content: space-between; align-items: baseline; }

  .dl.amber .n { color: #ffd08a; } .dl.coral .n { color: #ffb4a3; } .dl.teal .n { color: #9ff0e0; }
  .vlayer { position: absolute; left: 96px; width: 600px; padding: 20px 26px; border-radius: 20px; visibility: hidden;
           background: rgba(14, 30, 46, 0.72); border: 1px solid rgba(150, 215, 225, 0.22); backdrop-filter: blur(12px); font-family: var(--sans); color: #eaf4f6; }
  .vlayer .n { font-size: 18px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; }

<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="ui"></div>
  <div id="dip"></div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<script src="../node_modules/gsap/dist/MorphSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>

<script src="lib/words.js"></script>

<script type="module">
// "Pass the Blame" v2: the island diorama plus close-up sets, cut on exact narration words.
// ?ch=1..9 picks the chapter; &lo=1 renders the 3D at half resolution for drafts.
import { THREE, createRenderer, createPost } from './lib/ptb2/kit.js';
import { createIsland } from './lib/ptb2/island.js';
import { peopleSet, barsSet, salarySet, coinsSet, roomSet, pingpongSet, factorySet, wardSet, layersSet } from './lib/ptb2/sets.js';

const Q = new URLSearchParams(location.search);
const CH = Number(Q.get('ch') ?? 1);
const LO = Q.get('lo') ? 0.5 : 1;                 // draft: render the 3D at half resolution
const RW = 1920 * LO, RH = 1080 * LO;
const { renderer, envMap } = createRenderer(document.getElementById('gl'), RW, RH);
const post = createPost(renderer, RW, RH);
const I = createIsland(envMap);
const ui = document.getElementById('ui');

// ---------- sets (built on first use) and the cut list ----------
const SETS = { island: I };
const use = (name, make) => (SETS[name] ??= make());
const cuts = [];                 // { t, set, dip }
let TL;                          // the chapter timeline
// A shot: cut to `set` at time `at`, place its camera at `from`, then move toward `to`.
// The move lasts until the next cut unless `dur` is given.
function shot(set, at, from, to = null, { dur = null, ease = 'sine.inOut', dip = true, cue = true } = {}) {
  cuts.push({ t: at, set, dip, from, to, dur, ease });
  if (cue && at > 0.05) M.cue(at, 'whoosh', 0.28);
}
function finishShots() {
  cuts.sort((a, b) => a.t - b.t);
  cuts.forEach((c, i) => {
    const next = cuts[i + 1]?.t ?? DURATION;
    TL.set(c.set.rig, { ...c.from }, c.t);
    if (c.to) TL.to(c.set.rig, { ...c.to, duration: Math.min(c.dur ?? 1e9, next - c.t), ease: c.ease }, c.t);
  });
}

// ---------- DOM helpers ----------
const html = (s) => { const d = document.createElement('div'); d.innerHTML = s.trim(); const el = d.firstElementChild; ui.appendChild(el); return el; };
const card = (id, x, y, k, v, s = '', src = '', cls = '', w = 420) =>
  html(`<div class="card" id="${id}" style="left:${x}px; top:${y}px; width:${w}px"><div class="k">${k}</div><div class="v ${cls}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}${src ? `<div class="src">${src}</div>` : ''}</div>`);
const pins = [];
// Pin an element to a 3D point of a set (shown only while that set is on screen).
function pinTo(el, set, at, { ax = -50, ay = -100 } = {}) { gsap.set(el, { xPercent: ax, yPercent: ay }); pins.push({ el, set, at }); return el; }
const isl = (b, dy) => () => I.screen(b, dy).clone();
const pill = (id, set, at, text) => pinTo(html(`<div class="pill" id="${id}">${text}</div>`), set, at);
const label = (id, set, at, text) => pinTo(html(`<div class="lbl" id="${id}">${text}</div>`), set, at);
const dataLabel = (id, set, at, n, c, cls = '') => pinTo(html(`<div class="dl ${cls}" id="${id}"><div class="n">${n}</div><div class="c">${c}</div></div>`), set, at);
const chapterCard = (n, q) => html(`<div id="chapter"><div class="n">${n}</div><div class="q">${q}</div></div>`);
function showChapter(tl, at = 0.4, out = 4.0) {
  M.fadeIn(tl, '#chapter', at, { y: 20, dur: 0.8 }); M.cue(at, 'swell', 0.5);
  tl.to('#chapter', { autoAlpha: 0, y: -10, duration: 0.6 }, out);
}
const show = (tl, sel, at, out = null, opts = {}) => {
  M.fadeIn(tl, sel, at, { y: 16, dur: 0.6, ...opts }); M.cue(at, 'pop', 0.4);
  if (out !== null) tl.to(sel, { autoAlpha: 0, y: -8, duration: 0.45 }, out);
};
const hide = (tl, sel, at) => tl.to(sel, { autoAlpha: 0, duration: 0.4 }, at);
const beamTo = (tl, name, at, dur = 0.9) => { const p = I.B_POS(name); tl.to(I.beam, { x: p.x, z: p.z, duration: dur, ease: 'power3.inOut' }, at); M.cue(at, 'whoosh', 0.3); };
const S = (name, over = {}) => ({ ...I.SHOTS[name], ...over });

// ---------- the pressure meter ----------
function meterEl(drivers) {
  return html(`<div id="meter"><div class="mk"><span>Pressure</span><span class="lv" id="mLv">Low</span></div>
    <div class="segs">${'<i></i>'.repeat(12)}</div><div class="scale"><span>Low</span><span>High</span></div>
    <ul>${drivers.map((d, i) => `<li data-i="${i}">${d}</li>`).join('')}</ul></div>`);
}
const SEG_COL = (i) => (i < 4 ? '#7fe0cf' : i < 8 ? '#f6b55b' : '#ff8a73');
const meterState = { v: 0 };
function paintMeter() {
  const n = Math.round(meterState.v * 12);
  document.querySelectorAll('#meter .segs i').forEach((el, i) => { el.style.background = i < n ? SEG_COL(i) : ''; el.style.boxShadow = i < n ? `0 0 12px ${SEG_COL(i)}66` : ''; });
  const lv = document.getElementById('mLv'); if (!lv) return;
  const v = meterState.v; lv.textContent = v < 0.34 ? 'Low' : v < 0.5 ? 'Rising' : v < 0.75 ? 'High' : 'Very high';
  lv.style.color = SEG_COL(Math.max(0, n - 1));
}
const meter = (tl, at, v, dur = 1.4) => tl.to(meterState, { v, duration: dur, ease: 'power2.inOut', onUpdate: paintMeter }, at);

// ---------- narration: exact word times ----------
let K, VOICE_AT, WORDS;
const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
// Grow bar `key` of a bars set from `from`, landing exactly at `land` (just after its number is spoken).
const grow = (set, key, from, land) => TL.to(set.state, { [key]: 1, duration: Math.max(0.4, land - from), ease: 'power2.out' }, from);
const FT = (tl, target, from, to, at) => { tl.set(target, from, at); tl.to(target, to, at); };
function find(phrase, after) {
  const toks = phrase.split(/\s+/).map(norm).filter(Boolean);
  for (let i = 0; i < WORDS.length; i++) {
    if (VOICE_AT + WORDS[i].start < after - 1e-6) continue;
    if (toks.every((t, j) => WORDS[i + j] && norm(WORDS[i + j].w) === t)) return [VOICE_AT + WORDS[i].start, VOICE_AT + WORDS[i + toks.length - 1].end];
  }
  throw new Error(`phrase not found in narration: "${phrase}"`);
}
const w = (phrase, after = 0) => find(phrase, after)[0];      // when the phrase starts
const we = (phrase, after = 0) => find(phrase, after)[1];     // when its last word ends

// ---------- continuity: island state at the start of each chapter ----------
function baseState(ch) {
  const s = I.state;
  s.day = [1, 1, 1, 0.95, 0.85, 0.7, 0.5, 0.35, 0.08, 0][ch];
  s.pipeTreat = ch >= 5 ? 1 : 0; s.pipeBuild = ch >= 6 ? 1 : 0; s.buildFill = ch >= 6 ? 0.45 : 1;
  s.factory = ch >= 3 ? 0.35 : 1; s.hospLit = ch >= 5 ? 0.34 : 1; s.decisions = ch >= 8 ? 1 : 0;
  s.homeLit = ch >= 9 ? 1 : 0; s.whole = ch >= 9 ? 1 : 0; s.tokens = 0; s.journey = -1; s.ambulance = -1;
  I.beam.on = 0;
}

// =====================================================================================
const CHAPTERS = {
  // ---------------------------------------------------------------- cold open
  1: { voiceAt: 2.2, tail: 5.5, build(tl) {
    baseState(1);
    const ward = use('ward', () => wardSet(envMap));
    shot(I, 0, S('high', { dist: 92, angle: 0.7 }), S('wide', { dist: 60, angle: 1.0 }), { ease: 'power2.out', dip: false });
    M.cue(0.2, 'swell', 0.8);
    // each side, in its own place, says who is to blame
    const hosp = w("Germany's hospitals");
    shot(I, hosp - 0.35, S('hospital', { dist: 26, angle: 1.3 }), { dist: 21, angle: 1.45 });
    tl.set(I.beam, { x: I.B_POS('hospital').x, z: I.B_POS('hospital').z }, 0);
    tl.to(I.beam, { on: 1, duration: 0.6 }, hosp - 0.35);
    pill('p0', I, isl('hospital', 5.6), 'Hospitals: <b>underfunded</b>'); M.pop(tl, '#p0', hosp + 0.3, { cue: null });
    const ins = w('The insurers say');
    shot(I, ins - 0.25, S('insurers', { dist: 28, tilt: 0.2 }), { dist: 23, tilt: 0.3 }); beamTo(tl, 'insurers', ins - 0.25, 0.01);
    pill('p1', I, isl('insurers', 7.6), 'Insurers: <b>hospitals cost too much</b>'); M.pop(tl, '#p1', ins + 0.3, { cue: null });
    const sur = w('Surgeons say');
    tl.set(ward.state, { surgery: 1, night: 0.2 }, 0);
    shot(ward, sur - 0.25, { angle: 1.62, tilt: 0.08, dist: 9, tx: 0, ty: 2.8, tz: 0, fov: 30 }, { angle: 1.5, dist: 8 });
    pill('p2', ward, () => ward.anchor('theatre').setY(3.55), 'Surgeons: <b>prices ignore what surgery takes</b>'); M.pop(tl, '#p2', sur + 0.3, { cue: null });
    const sts = w('The states say');
    shot(I, sts - 0.25, S('state', { dist: 24, angle: 1.2 }), { dist: 20, angle: 1.38 }); beamTo(tl, 'state', sts - 0.25, 0.01);
    pill('p3', I, isl('state', 5.0), 'States: <b>Berlin is meddling</b>'); M.pop(tl, '#p3', sts + 0.3, { cue: null });
    const ber = w('Berlin says');
    shot(I, ber - 0.2, S('berlin', { dist: 25, angle: 2.15 }), { dist: 20.5, angle: 1.95 }); beamTo(tl, 'berlin', ber - 0.2, 0.01);
    pill('p4', I, isl('berlin', 4.6), 'Berlin: <b>too many beds, too little reform</b>'); M.pop(tl, '#p4', ber + 0.3, { cue: null });
    hide(tl, '#p0', ins - 0.25); hide(tl, '#p1', sur - 0.25); hide(tl, '#p3', ber - 0.2);
    // everyone points: the beam whips round the island
    const ev = w('Everyone feels');
    shot(I, ev - 0.3, S('high', { dist: 58, angle: 0.9 }), { dist: 66, angle: 1.35 });
    ['state', 'insurers', 'hospital', 'berlin', 'practice', 'insurers', 'state', 'hospital', 'table'].forEach((b, i) => beamTo(tl, b, w('Everyone points') - 0.2 + i * 0.36, 0.32));
    tl.to(I.beam, { on: 0, duration: 0.8 }, K.end(1) + 0.2);
    // follow one operation: a low tracking shot of one patient on the road
    const fo = w('To find out');
    FT(tl, I.state, { journey: 0.02 }, { journey: 0.3, duration: K.end(2) + 6 - fo, ease: 'none' }, fo - 0.5);
    shot(I, fo - 0.5, { angle: 1.9, tilt: 0.32, dist: 7.5, tx: 8, ty: 0.6, tz: 6.4, fov: 30, follow: 1 }, { angle: 1.55, dist: 8.5 });
    tl.set(I.rig, { follow: 0 }, K.end(2) + 0.6);
    // title over the island
    shot(I, K.end(2) + 0.6, S('wide', { dist: 46, angle: 1.3, tilt: 0.42 }), { dist: 54, angle: 1.15, tilt: 0.5 });
    html(`<div id="scrim" style="position:absolute; inset:0; background:radial-gradient(60% 45% at 50% 42%, rgba(8,16,28,0.62), rgba(8,16,28,0) 100%); visibility:hidden"></div>`);
    M.fadeIn(tl, '#scrim', K.end(2) + 0.7, { y: 0, dur: 1.2 });
    html(`<div id="title"><div class="t">Pass the Blame</div><div class="st">Germany · healthcare · 2026</div></div>`);
    gsap.set('#title', { xPercent: -50, yPercent: -50 });
    M.fadeIn(tl, '#title', K.end(2) + 0.9, { y: 20, dur: 1.1 }); M.cue(K.end(2) + 0.9, 'hit', 0.7);
    tl.to(['.pill'], { autoAlpha: 0, duration: 0.01 }, ev - 0.3);
  } },

  // ---------------------------------------------------------------- 1 · the pressure
  2: { voiceAt: 2.0, build(tl) {
    baseState(2);
    chapterCard('Chapter 1 · The pressure', 'Why is everyone under pressure?'); showChapter(tl, 0.4, w('One German') - 1.0);
    shot(I, 0, S('wide', { dist: 50, angle: 0.95, tilt: 0.5 }), { dist: 56, angle: 1.25, tilt: 0.58 }, { dip: false });
    meterEl(['Ageing population', 'Costs growing faster than income', 'Economy barely growing']);
    M.fadeIn(tl, '#meter', w('nobody chose') - 0.2, { y: 10 }); meter(tl, w('nobody chose'), 0.25);
    // 100 people: one in five aged 67+, then one in four
    const pe = use('people', () => peopleSet(envMap));
    const g = w('One German');
    tl.set(pe.state, { pop: 0, aged: 0 }, 0);
    tl.to(pe.state, { pop: 1, duration: 1.6, ease: 'power2.out' }, g - 0.3);
    tl.to(pe.state, { aged: 20, duration: 1.0, ease: 'none' }, w('67') - 0.1);
    tl.to(pe.state, { aged: 25, duration: 0.8, ease: 'none' }, w('2035'));
    shot(pe, g - 0.3, { angle: 1.1, tilt: 0.9, dist: 25, tx: 0, ty: 0, tz: 0.4, fov: 30 }, { angle: 1.45, tilt: 0.55, dist: 21.5 });
    card('cAge', 96, 300, 'Aged 67 or over', '<span style="display:grid"><span id="ageA" style="grid-area:1/1">1 in 5 · 2024</span><span id="ageB" style="grid-area:1/1; visibility:hidden">1 in 4 · 2035</span></span>', 'of every 100 Germans (2035: projected)', 'Destatis projection, Dec 2025', 'amber', 420);
    show(tl, '#cAge', w('67') - 0.2);
    tl.to('#ageA', { autoAlpha: 0, duration: 0.3 }, w('2035') + 0.5); tl.to('#ageB', { autoAlpha: 1, duration: 0.3 }, w('2035') + 0.6);
    M.cue(w('2035') + 0.6, 'tick', 0.5);
    M.fadeIn(tl, '#meter li[data-i="0"]', w('More patients'), { y: 6 }); meter(tl, w('More patients'), 0.4);
    hide(tl, '#cAge', w('Health already') - 0.3);
    // €538bn: coins, one coin = €1bn
    const co = use('spend', () => coinsSet(envMap, { value: 538, perStack: 30, cols: 6, coin: 0.36 }));
    const ha = w('Health already');
    tl.set(co.state, { fill: 0 }, 0); tl.to(co.state, { fill: 1, duration: 2.6, ease: 'power1.inOut' }, ha);
    shot(co, ha - 0.25, { angle: 1.0, tilt: 0.42, dist: 21, tx: 0, ty: 1.5, tz: 0, fov: 30 }, { angle: 1.3, tilt: 0.34, dist: 23 });
    card('cSpend', 96, 300, 'Health spending · 2024', '€538bn', 'a year · 12.4% of GDP', 'Destatis · each coin = €1bn', '', 380);
    show(tl, '#cSpend', w('500 billion') - 0.2);
    hide(tl, '#cSpend', w('Contributions') - 0.3);
    // 42% of a salary
    const sa = use('salary', () => salarySet(envMap));
    const ct = w('Contributions');
    tl.set(sa.state, { split: 0, spin: -0.4 }, 0);

// =====================================================================================
const C = CHAPTERS[CH];
const key = CH <= 8 ? `ptb-0${CH}` : null;
const segs = key ? window.TIMINGS[key] : null;
VOICE_AT = C.voiceAt; WORDS = key ? window.WORDS[key].filter((x) => norm(x.w)) : [];
const DURATION = C.duration ?? +(VOICE_AT + segs[segs.length - 1].end + (C.tail ?? 2.2)).toFixed(2);
const dip = document.getElementById('dip');
const v3 = new THREE.Vector3();
let lastSet = null;

M.scene({
  duration: DURATION, key, voiceAt: VOICE_AT, fadeIn: CH === 1 ? 1.2 : 0.7, fadeOut: 0.7,
  build(tl, k) { TL = tl; K = k; C.build(tl, k); finishShots(); },
  afterSeek(t) {
    // the active shot
    let i = 0; while (i + 1 < cuts.length && cuts[i + 1].t <= t) i++;
    const c = cuts[i], set = c.set;
    set.update(t);
    const p = set === I ? { ...I.post, threshold: 0.95 + 0.45 * I.state.day } : set.post;
    post.render(set.scene, set.camera, p);
    // a short dip to navy across each cut
    let d = 0;
    for (const x of cuts) if (x.dip && x.t > 0.05) d = Math.max(d, 1 - Math.abs(t - x.t) / 0.2);
    dip.style.opacity = Math.max(0, d).toFixed(3);
    // pinned labels follow their 3D anchors; hidden while their set is off screen
    for (const pn of pins) {
      if (pn.set !== set) { pn.el.style.display = 'none'; continue; }
      pn.el.style.display = '';
      v3.copy(pn.at()).project(set.camera);
      pn.el.style.left = `${(v3.x * 0.5 + 0.5) * 1920}px`; pn.el.style.top = `${(-v3.y * 0.5 + 0.5) * 1080}px`;
    }
    lastSet = set;
  },
});
window.CHAPTER = { CH, duration: DURATION, voiceAt: VOICE_AT, cuts: () => cuts.map((c) => +c.t.toFixed(2)) };
</script>
</body>
